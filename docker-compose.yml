services:
  db:
    image: postgres:15-alpine
    container_name: nautilus_db
    restart: always
    environment:
      POSTGRES_USER: user_nautilus
      POSTGRES_PASSWORD: password_secure_123
      POSTGRES_DB: nautilus_clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nautilus_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nautilus.cl
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  postgres_data: